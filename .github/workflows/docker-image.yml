name: Docker image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Build records are optional artifacts; publishing must not depend on their quota.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  quality-gate:
    name: Static checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify source integrity
        run: python3 scripts/source_integrity_gate.py

      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: p0-release-gate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            pc/package-lock.json
            mobile/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix web ci
          npm --prefix pc ci
          npm --prefix mobile ci

      # The full test gate remains available locally in scripts/p0-release-gate.sh.
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --lib --bins -- -D warnings

      - name: Check admin frontend
        run: |
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run build

      - name: Check PC frontend
        run: |
          npm --prefix pc run type-check
          npm --prefix pc run build

      - name: Check mobile frontend
        run: |
          npm --prefix mobile run build:pwa
          npm --prefix mobile run check:artifacts:pwa
          npm --prefix mobile run check:bundle
          npm --prefix mobile run build:tauri
          npm --prefix mobile run check:artifacts:tauri
          npm --prefix mobile run check:bundle

  pull-request-build:
    name: Build pull request
    if: github.event_name == 'pull_request'
    needs:
      - quality-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify source integrity
        run: python3 scripts/source_integrity_gate.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=backend-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-image-${{ matrix.arch }}

  publish-platform:
    name: Build and publish ${{ matrix.platform }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - quality-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify source integrity
        run: python3 scripts/source_integrity_gate.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-image-${{ matrix.arch }}

      - name: Export digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64|arm64) ;;
            *) echo "Unexpected architecture: $ARCH" >&2; exit 1 ;;
          esac
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Missing or invalid image digest for $ARCH" >&2
            exit 1
          fi
          # Matrix completion order is arbitrary; each arch owns a distinct key.
          printf 'digest_%s=%s\n' "$ARCH" "$DIGEST" >> "$GITHUB_OUTPUT"

  publish-manifest:
    name: Publish multi-platform manifest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - publish-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify source integrity
        run: python3 scripts/source_integrity_gate.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_DIGEST: ${{ needs.publish-platform.outputs.digest_amd64 }}
          ARM64_DIGEST: ${{ needs.publish-platform.outputs.digest_arm64 }}
        run: |
          set -euo pipefail
          source_args=()
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Both architecture digests are required to publish" >&2
              exit 1
            fi
            source_args+=("${REGISTRY_IMAGE}@${digest}")
          done
          if [[ "$AMD64_DIGEST" == "$ARM64_DIGEST" ]]; then
            echo "Architecture digests must be distinct" >&2
            exit 1
          fi
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=("-t" "$tag")
          done <<< "$IMAGE_TAGS"
          if (( ${#tag_args[@]} == 0 )); then
            echo "No image tags were generated" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
